<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>buget — login</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #0a0a0a;
      color: #eaeaea;
      font-family: monospace;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .card {
      background: #111111;
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 12px;
      padding: 36px 32px;
      width: 100%;
      max-width: 360px;
    }

    h1 {
      font-size: 22px;
      font-weight: 700;
      letter-spacing: 2px;
      color: #33E29A;
      margin-bottom: 6px;
    }

    p.sub {
      font-size: 11px;
      color: #8b8b8b;
      margin-bottom: 28px;
      letter-spacing: 1px;
    }

    label {
      display: block;
      font-size: 11px;
      color: #8b8b8b;
      letter-spacing: 1px;
      margin-bottom: 6px;
    }

    input {
      width: 100%;
      background: #1c1c1c;
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 8px;
      color: #eaeaea;
      font-family: monospace;
      font-size: 14px;
      padding: 12px 14px;
      outline: none;
      margin-bottom: 16px;
      transition: border-color 0.15s;
    }

    input:focus {
      border-color: #33E29A;
    }

    button {
      width: 100%;
      background: #33E29A;
      color: #0a0a0a;
      border: none;
      border-radius: 8px;
      font-family: monospace;
      font-size: 14px;
      font-weight: 700;
      letter-spacing: 1px;
      padding: 13px;
      cursor: pointer;
      margin-top: 4px;
      transition: opacity 0.15s;
    }

    button:hover { opacity: 0.85; }

    .error {
      background: rgba(255, 77, 77, 0.1);
      border: 1px solid rgba(255, 77, 77, 0.3);
      border-radius: 8px;
      color: #ff4d4d;
      font-size: 12px;
      padding: 10px 14px;
      margin-bottom: 16px;
      letter-spacing: 0.5px;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>buget</h1>
    <p class="sub">sign in to continue</p>

    <div id="error-box" class="error" style="display:none">
      invalid email or password
    </div>

    <form method="POST" action="/login">
      <label for="email">email</label>
      <input
        type="email"
        id="email"
        name="email"
        placeholder="you@example.com"
        autocomplete="email"
        required
      />

      <label for="password">password</label>
      <input
        type="password"
        id="password"
        name="password"
        placeholder="••••••••"
        autocomplete="current-password"
        required
      />

      <button type="submit">sign in</button>
    </form>
  </div>

  <script>
    if (window.location.search.includes('error=1')) {
      document.getElementById('error-box').style.display = 'block';
    }
  </script>
</body>
</html>
